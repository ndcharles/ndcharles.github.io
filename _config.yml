# Site
name: 'MLIT'
# Site name for search engines and link previews (og:site_name, structured data).
title: 'MLIT by Ndcharles'
# Added after every page title except the homepage: "Post title - My Life in Tech by Ndcharles Nweke".
brand: 'My Life in Tech by Ndcharles Nweke'
description: 'Welcome to MyLifeInTech, a tech blog by Ndcharles Nweke on Data, Tech and its Products.'
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
url: 'https://ndcharles.github.io'
baseurl: ''
google_analytics: 'G-EBC8NBRK90'
email: 'ndcharles.edu@gmail.com'

include: ["_pages"]

# Build posts and notes even if their date is a few minutes or hours ahead of the build
# (Pages CMS fills in "now", which can land after the deploy starts). Drafts are hidden
# with the Published switch, not with future dates.
future: true
permalink: /:title
google_site_verification: aFoRrj4Mizc_WYiBreiSaocQzFy_4ZEPfv8YK5HJCio

# Plugins
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-target-blank

# Author of every post. Shown by _includes/author-bio.html and read by
# _includes/seo.html as the Person who writes and publishes the site.
author:
  name:     Ndcharles Nweke
  first_name: Ndcharles
  last_name:  Nweke
  avatar:   'assets/images/ndcharles.png'
  bio:      "Hi, I am Ndcharles. I write about my experience in data science, tech and its products."
  twitter:  nndcharles
  url:      https://ndcharles.github.io/about.html
  title:    Data and IT Operations
  # Your profiles elsewhere, so search engines know they are the same person.
  same_as:
    - https://www.linkedin.com/in/nndcharles
    - https://x.com/nndcharles
    - https://github.com/ndcharles

# thatbros Worker: love counts and comments on B-Roll notes.
# turnstile_site_key is needed for readers to post comments (Cloudflare dash -> Turnstile).
thatbros:
  api_url: https://thatbros.ndcharles.workers.dev
  turnstile_site_key: '0x4AAAAAAFDl--WqO6c4HI99'

# B-Roll: short notes in _b-roll/, listed at /blog-roll.html
# Portfolio: projects in _portfolio/, listed at /portfolio.html
collections:
  b-roll:
    output: true
    permalink: /blog-roll/:name
  portfolio:
    output: true
    permalink: /portfolio/:name

twitter:
    username: nndcharles
    card: summary_large_image
    
# Defaults
defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      comments: true

  - scope:
      path: ""
      type: "b-roll"
    values:
      layout: b-roll

  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: portfolio
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
# Syntax
markdown: kramdown
highlighter: rouge

# Paginate
paginate: 10



# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules, .pages.yml]
