# Site
name: 'MLIT'
description: 'Welcome to MyLifeInTech, a tech blog by Ndcharles Nweke on Data, Tech and its Products.'
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
url: 'https://ndcharles.github.io'
baseurl: ''
google_analytics: 'G-EBC8NBRK90'
email: 'ndcharles.edu@gmail.com'

include: ["_pages"]
permalink: /:title
google_site_verification: aFoRrj4Mizc_WYiBreiSaocQzFy_4ZEPfv8YK5HJCio

# Plugins
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-target-blank

# Author of every post. Shown by _includes/author-bio.html and read by
# jekyll-seo-tag for the author/publisher in structured data.
author:
  name:     Ndcharles Nweke
  avatar:   'assets/images/ndcharles.png'
  bio:      "Hi, I am Ndcharles. I write about my experience in data science, tech and its products."
  twitter:  nndcharles
  url:      https://ndcharles.github.io/about.html
  title:    Data and IT Operations

# thatbros Worker: love counts and comments on B-Roll notes.
# turnstile_site_key is needed for readers to post comments (Cloudflare dash -> Turnstile).
thatbros:
  api_url: https://thatbros.ndcharles.workers.dev
  turnstile_site_key: '0x4AAAAAAFDl--WqO6c4HI99'

# B-Roll: short notes in _b-roll/, listed at /blog-roll.html
# Portfolio: projects in _portfolio/, listed at /portfolio.html
collections:
  b-roll:
    output: true
    permalink: /blog-roll/:name
  portfolio:
    output: true
    permalink: /portfolio/:name

twitter:
    username: nndcharles
    card: summary_large_image
    
# Defaults
defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      comments: true

  - scope:
      path: ""
      type: "b-roll"
    values:
      layout: b-roll

  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: portfolio
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
# Syntax
markdown: kramdown
highlighter: rouge

# Paginate
paginate: 10


prose:
  rooturl: ''
  siteurl: 'http://ndcharles.github.io'
  media: 'assets/images'
  metadata:
    _posts:
      - name: "layout"
        field:
          label: "layout"
          element: "text"
          value: "post"
      - name:
        field:
          label: "date"
          element: "text"
          value: "CURRENT_DATETIME"
      - name: "title"
        field:
          element: "text"
          label: "Title"
          value: ""
      - name: "published"
        field:
          element: "checkbox"
          label: "Published"
          value: false
      - name: "category"
        field:
          element: "multiselect"
          label: "Select Categories"
          placeholder: "Choose Categories"
          options:
            - name: "Product"
              value: "product"
            - name: "Data"
              value: "data"
            - name: "Tech"
              value: "tech"
            - name: "Jekyll"
              value: "jekyll"
      - name: "tags"
        field:
          element: "multiselect"
          label: "Add Tags"
          placeholder: "Choose Tags"
          alterable: true
          options:
            - name: "Featured"
              value: "featured"
            - name: "Product Management"
              value: "product_management"
            - name: "Data Science"
              value: "data_science"
            - name: "Growth Marketing"
              value: "growth_marketing"
            - name: "Jekyll"
              value: "jekyll"
            - name: "StartUp"
              value: "startup"
            - name: "Python"
              value: "python"
            - name: "Data Engineering"
              value: "data_engineering"
            - name: "Excel"
              value: "excel"
            - name: "Sticky"
              value: "sticky"
      - name: "excerpt"
        field:
          label: "excerpt"
          element: "text"
          placeholder: "Enter excerpt"
      - name: "meta"
        field:
          label: "meta"
          element: "text"
          placeholder: "Enter metadata"

# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules]
