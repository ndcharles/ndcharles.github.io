<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved</title>
{%- comment -%} For moved pages: set `redirect_to` in front matter. GitHub Pages can't send 301s, so this is the standard fallback. {%- endcomment -%}
<link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
<script>location.replace({{ page.redirect_to | relative_url | jsonify }});</script>
</head>
<body><p>This page moved to <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to | absolute_url }}</a>.</p></body>
</html>
